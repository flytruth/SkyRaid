# ============================================================
#  BaseRaid — небесные базы и рейды
# ============================================================

# Мир, в котором размещаются базы (остров в небе)
world: world
# Высота (Y) поверхности островов
base-y: 200
# Расстояние между островами (добавляется к удвоенному макс. радиусу)
grid-gap: 32

# Точка возврата после рейда (спавн)
spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0
  pitch: 0

# Границы защищаемого региона относительно уровня острова
region:
  height-above: 48
  depth-below: 6

# Покупка базы
purchase:
  # Сколько часов защиты даётся при покупке
  initial-fuel-hours: 24
  # Стоимость. Если установлен Vault+экономика — списываются монеты,
  # иначе — предметы (монеты или ресурсы)
  cost:
    coins: 10000
    items:
      DIAMOND: 32

# Ядро базы
core:
  # Предмет, парящий над пьедесталом (ядро = булава)
  display-item: MACE
  # Блок-пьедестал в центре острова
  pedestal: OBSIDIAN

# Остров (чем выше уровень — тем больше остров)
island:
  top: GRASS_BLOCK
  filler: DIRT
  filler-layers: 2
  # Уровни: радиус и стоимость улучшения до этого уровня
  levels:
    1:
      radius: 8
      cost: {coins: 0}
    2:
      radius: 12
      cost:
        coins: 5000
        items: {DIAMOND: 32}
    3:
      radius: 16
      cost:
        coins: 15000
        items: {DIAMOND: 32, NETHERITE_INGOT: 8}

# Стены (появляются вокруг ядра на время рейда)
wall:
  # Стена 2x2: толщина и высота в блоках
  height: 2
  thickness: 2
  # Отступ стены от края острова (ширина зоны высадки рейдера)
  inset: 3
  levels:
    1:
      material: IRON_BLOCK
      name: "Железная"
      hp: 10
      cost: {coins: 0}
    2:
      material: DIAMOND_BLOCK
      name: "Алмазная"
      hp: 20
      cost:
        coins: 8000
        items: {DIAMOND: 32}
    3:
      material: NETHERITE_BLOCK
      name: "Незеритовая"
      hp: 30
      cost:
        coins: 20000
        items: {DIAMOND: 32, NETHERITE_INGOT: 16}

# Топливо ядра: 1 предмет = X часов защиты, максимум 24 часа
fuel:
  item: COAL
  hours-per-item: 1
  max-hours: 24

# Рейды
raid:
  # Длительность рейда (минуты)
  duration-minutes: 10
  # Защита базы после рейда (минуты)
  cooldown-minutes: 30
  # Урон стены от одного взрыва ТНТ
  tnt-damage: 2
  # Урон стены от одного огненного заряда
  fire-charge-damage: 1
  # Разрешать ли рейдеру ломать/ставить блоки после прорыва стены
  allow-break-after-breach: true

