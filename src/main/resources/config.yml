# ============================================================================
#  SkyRaid — конфигурация
#  Небесные базы, топливная защита ядра, стены и рейды.
#
#  Формат цен: "МАТЕРИАЛ:КОЛИЧЕСТВО", например "DIAMOND:16".
#  Все сообщения поддерживают цветовые коды '&'.
# ============================================================================

island:
  # Мир, в котором создаются острова.
  world: world
  # Высота, на которой генерируется платформа острова.
  spawn-height: 200
  # Минимальное расстояние между центрами островов (блоки).
  min-distance: 300
  # Радиус поиска свободного места от центра мира.
  search-radius: 3000
  # Сколько попыток подбора координат сделать перед ошибкой.
  max-attempts: 64
  # Размер стороны острова (в блоках) для уровней 1..5.
  sizes: [9, 13, 17, 21, 25]
  # Верхний слой платформы.
  top-block: GRASS_BLOCK
  # Наполнитель под верхним слоем.
  fill-block: STONE
  # Блок ядра базы. Heavy Core визуально повторяет навершие булавы.
  core-block: HEAVY_CORE
  # Подсветка углов острова (поставьте AIR, чтобы выключить).
  light-block: SEA_LANTERN

base:
  # Цена покупки первого острова.
  buy-cost:
    - "DIAMOND:16"
  # Цена расширения острова до уровней 2..5.
  upgrade-cost:
    2: ["DIAMOND:32"]
    3: ["DIAMOND:64"]
    4: ["EMERALD_BLOCK:8"]
    5: ["NETHERITE_INGOT:4"]

wall:
  # Предмет-топливо для записи ядра.
  fuel-item: BLAZE_POWDER
  # Сколько часов защиты даёт одна единица топлива.
  fuel-hours-per-item: 1
  # Максимальный запас защиты, который можно записать в ядро (часы).
  max-protection-hours: 24
  # Цена улучшения стены до уровней 2 и 3.
  upgrade-cost:
    2: ["DIAMOND:12"]
    3: ["NETHERITE_INGOT:2"]
  # Уровни стен: материал, прочность (попаданий взрывчатки) и имя.
  levels:
    1:
      name: "&fЖелезная"
      material: IRON_BLOCK
      hp: 8
    2:
      name: "&bАлмазная"
      material: DIAMOND_BLOCK
      hp: 16
    3:
      name: "&5Незеритовая"
      material: NETHERITE_BLOCK
      hp: 32

raid:
  # Длительность рейда (секунды). 600 = 10 минут.
  duration-seconds: 600
  # Задержка между применениями взрывчатки (миллисекунды).
  use-cooldown-millis: 750
  # Перезарядка между рейдами одного игрока (секунды).
  cooldown-seconds: 1800
  # Цена входа в рейд (пусто — бесплатно).
  entry-cost: []
  # Куда телепортировать рейдера после рейда.
  # WORLD_SPAWN — спавн мира базы, либо координаты в формате "world;x;y;z".
  end-teleport: WORLD_SPAWN
  # Взрывчатка и урон по стене за одно применение.
  explosives:
    TNT: 4
    FIRE_CHARGE: 1

